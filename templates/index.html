<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi5 Network Location Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
        .container { display: grid; grid-template-columns: 350px 1fr; height: 100vh; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .sidebar { max-height: 40vh; overflow-y: auto; } }
        .sidebar { background: #16213e; padding: 20px; overflow-y: auto; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #00d9ff; }
        .info-card { background: #1a1a2e; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .info-card h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        .info-value { font-size: 1.2rem; font-weight: 600; }
        .coordinates { font-family: monospace; color: #00d9ff; }
        .status { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .btn { background: #00d9ff; color: #000; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #00b8d9; }
        #map { width: 100%; height: 100%; }
        .timestamp { font-size: 0.8rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🛰️ RPi5 Location</h1>
            <div class="info-card"><h3>Status</h3><div class="status"><div class="status-dot" id="statusDot"></div><span id="statusText">Connecting...</span></div></div>
            <div class="info-card"><h3>Current Location</h3><div class="info-value" id="locationText">Loading...</div><div class="timestamp" id="timestampText"></div></div>
            <div class="info-card"><h3>Coordinates</h3><div class="info-value coordinates" id="coordsText">---, ---</div></div>
            <div class="info-card"><h3>IP Address</h3><div class="info-value" id="ipText">---</div></div>
            <div class="info-card"><h3>Network Provider</h3><div class="info-value" id="orgText">---</div></div>
            <div class="info-card"><h3>Timezone</h3><div class="info-value" id="tzText">---</div></div>
            <button class="btn" onclick="refreshLocation()">🔄 Refresh Location</button>
        </div>
        <div id="map"></div>
    </div>
    <script>
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 19 }).addTo(map);
        const markerIcon = L.divIcon({ html: '<div style="width:20px;height:20px;background:#00d9ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 20px #00d9ff;"></div>', className: 'custom-marker', iconSize: [20, 20], iconAnchor: [10, 10] });
        let marker = null, accuracyCircle = null;
        function updateMap(lat, lng) {
            if (marker) { marker.setLatLng([lat, lng]); } else { marker = L.marker([lat, lng], { icon: markerIcon }).addTo(map); }
            if (accuracyCircle) { accuracyCircle.setLatLng([lat, lng]); } else { accuracyCircle = L.circle([lat, lng], { color: '#00d9ff', fillColor: '#00d9ff', fillOpacity: 0.1, radius: 25000 }).addTo(map); }
            map.setView([lat, lng], 10);
        }
        function updateUI(data) {
            document.getElementById('statusText').textContent = 'Live';
            document.getElementById('statusDot').style.background = '#00ff88';
            document.getElementById('locationText').textContent = (data.city || 'Unknown') + ', ' + (data.region || '') + ', ' + (data.country || '');
            document.getElementById('coordsText').textContent = (data.latitude?.toFixed(4) || '---') + ', ' + (data.longitude?.toFixed(4) || '---');
            document.getElementById('ipText').textContent = data.ip || '---';
            document.getElementById('orgText').textContent = data.org || '---';
            document.getElementById('tzText').textContent = data.timezone || '---';
            if (data.timestamp) { document.getElementById('timestampText').textContent = 'Updated: ' + new Date(data.timestamp).toLocaleString(); }
            if (data.latitude && data.longitude) { updateMap(data.latitude, data.longitude); }
        }
        function showError(msg) { document.getElementById('statusText').textContent = msg; document.getElementById('statusDot').style.background = '#ff4444'; }
        async function fetchLocation() { try { const r = await fetch('/api/location'); if (r.ok) { updateUI(await r.json()); } else { showError('No location data'); } } catch (e) { showError('Connection error'); } }
        async function refreshLocation() { document.getElementById('statusText').textContent = 'Updating...'; try { const r = await fetch('/api/location/update'); if (r.ok) { updateUI(await r.json()); } else { showError('Update failed'); } } catch (e) { showError('Connection error'); } }
        fetchLocation(); setInterval(fetchLocation, 60000);
    </script>
</body>
</html>
